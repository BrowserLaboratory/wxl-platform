name: Quality Gates

on:
  # `main` is the only long-lived branch: ticket branches squash into it. The
  # same set on both triggers — gating only one would leave either the pull
  # requests or the merge results unchecked; the set equality is pinned by
  # tests/unit/workflows/trigger-branches.test.ts.
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Upstream-only tests (tests/unit/scripts/upstream-guard.test.ts) must fail, not silently skip,
    # if this ever disagrees with the decision upstream-guard.test.ts computes itself (T-0011).
    # Spelled through format(), never UPSTREAM_SLUG — a workflow YAML cannot import a TS module.
    env:
      WXL_EXPECT_UPSTREAM: ${{ github.repository == format('{0}/{1}', 'BrowserLaboratory', 'wxl-platform') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # taiki-e/install-action installs pinned prebuilt binaries into
          # $CARGO_HOME/bin; a restored binary cache would shadow them.
          cache-bin: "false"

      - name: Install wasm-pack
        uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d # v2.79.2
        with:
          tool: wasm-pack@0.14.0,wasm-tools@1.249.0  # Pinned per spec ci-quality-gates: CI workflows install build toolchain at fixed versions

      - name: Install binaryen (wasm-opt)
        uses: ./.github/actions/install-binaryen

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM modules
        run: pnpm wasm:build

      - name: Generate challenge keys
        run: pnpm challenge:keygen

      - name: Run Rust/WASM tests
        run: pnpm wasm:test

      - name: Run tests
        run: pnpm test --run

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # taiki-e/install-action installs pinned prebuilt binaries into
          # $CARGO_HOME/bin; a restored binary cache would shadow them.
          cache-bin: "false"

      - name: Install wasm-pack
        uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d # v2.79.2
        with:
          tool: wasm-pack@0.14.0,wasm-tools@1.249.0  # Pinned per spec ci-quality-gates: CI workflows install build toolchain at fixed versions

      - name: Install binaryen (wasm-opt)
        uses: ./.github/actions/install-binaryen

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM modules
        run: pnpm wasm:build

      - name: Generate challenge keys
        run: pnpm challenge:keygen

      - name: Validate challenge frontmatter
        run: pnpm challenge:validate

      - name: Build VitePress site
        run: pnpm docs:build

  prose-audit:
    # PR-time deterministic prose audit on changed outward-facing markdown.
    # Guarded to pull_request because the base-vs-head diff needs github.base_ref,
    # which is empty on push events.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/prose-audit/requirements.txt

      - name: Install prose-audit dependencies
        run: pip install -r scripts/prose-audit/requirements.txt

      - name: Compute changed outward markdown
        id: diff
        run: |
          git fetch origin "${{ github.base_ref }}"
          # Single space-separated line: each path becomes a positional arg to run.py.
          # A multi-line value would split across shell lines and run later paths as commands.
          CHANGED=$(git diff --name-only --diff-filter=AMR -M "origin/${{ github.base_ref }}...HEAD" -- '*.md' | tr '\n' ' ')
          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Run Phase-1 prose audit
        # SECURITY (CWE-78 script injection): the changed-file list is
        # attacker-controllable — a fork PR can add a markdown file whose NAME
        # contains shell metacharacters (git filenames allow any byte but / and
        # NUL, and `git diff --name-only` does not escape ASCII $ ( ) ; | & `).
        # It MUST NOT be spliced into `run:` via `${{ }}`, because Actions
        # macro-expands that into the script body BEFORE bash parses it, so a
        # name like `x$(curl…|bash)y.md` would execute. Passing it through `env:`
        # keeps it as DATA: a shell variable's value is never re-parsed for
        # command substitution. `set -f` disables globbing so the intentional
        # unquoted word-split (one file → one positional arg) stays data-only.
        env:
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
        run: |
          set -f
          python scripts/prose-audit/run.py $CHANGED_FILES \
            --out audit-runs/prose-phase1-ci/ \
            --json-summary audit-runs/prose-phase1-ci/summary.json

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: prose-audit-phase1-reports
          path: audit-runs/prose-phase1-ci/
          retention-days: 14

  site-smoke:
    # Advisory browser smoke against the built+previewed site. Runs in parallel
    # with test/build/prose-audit (no needs:). NOT in the branch-protection
    # required-status-checks list — a failure here does not block merge. Job ID
    # is kept stable so a future change can promote it to a required check.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # taiki-e/install-action installs pinned prebuilt binaries into
          # $CARGO_HOME/bin; a restored binary cache would shadow them.
          cache-bin: "false"

      - name: Install wasm-pack
        uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d # v2.79.2
        with:
          tool: wasm-pack@0.14.0,wasm-tools@1.249.0  # Pinned per spec ci-quality-gates: CI workflows install build toolchain at fixed versions

      - name: Install binaryen (wasm-opt)
        uses: ./.github/actions/install-binaryen

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM modules
        run: pnpm wasm:build

      - name: Generate challenge keys
        run: pnpm challenge:keygen

      - name: Build VitePress site
        run: pnpm docs:build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run site-smoke tests
        run: pnpm test:smoke

  challenge-verify:
    # The challenge exploit suite (playwright.config.ts). Runs in parallel with
    # test/build/prose-audit (no needs:), and separately from site-smoke: this
    # one IS a required status check, so the two must not share a job's fate.
    # It drives the in-page runtime through __wxlDispatch against the dev
    # server, which the Playwright config starts; site-smoke drives the built
    # site through a preview server. Different preconditions, different job.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # taiki-e/install-action installs pinned prebuilt binaries into
          # $CARGO_HOME/bin; a restored binary cache would shadow them.
          cache-bin: "false"

      - name: Install wasm-pack
        uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d # v2.79.2
        with:
          tool: wasm-pack@0.14.0,wasm-tools@1.249.0  # Pinned per spec ci-quality-gates: CI workflows install build toolchain at fixed versions

      - name: Install binaryen (wasm-opt)
        uses: ./.github/actions/install-binaryen

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM modules
        run: pnpm wasm:build

      - name: Generate challenge keys
        run: pnpm challenge:keygen

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run challenge exploit suite
        run: pnpm test:challenges

  fork-init-cross-os:
    # Upstream-only (T-0011): the fork-init engine and its upstream guard must prove out on every
    # OS/Node combination a teacher may run `pnpm fork:init` on — Windows, macOS and Ubuntu, and
    # both LTS Node lines — but only upstream itself pays for the matrix. Spelled through format(),
    # never UPSTREAM_SLUG (a workflow YAML cannot import a TS module); pinned by
    # tests/unit/workflows/upstream-only-jobs.test.ts.
    if: github.repository == format('{0}/{1}', 'BrowserLaboratory', 'wxl-platform')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node-version: 24
          - os: macos-latest
            node-version: 24
          - os: ubuntu-latest
            node-version: 24
          - os: ubuntu-latest
            node-version: 22
    runs-on: ${{ matrix.os }}
    env:
      WXL_EXPECT_UPSTREAM: ${{ github.repository == format('{0}/{1}', 'BrowserLaboratory', 'wxl-platform') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run fork-init and upstream-guard tests
        run: pnpm vitest run tests/unit/scripts/fork-init.test.ts tests/unit/scripts/upstream-guard.test.ts
