# ─────────────────────────────────────────────────────────────────────────────
# FROZEN BASELINE — test fixture, NOT an executable workflow.
#
# This is a verbatim copy of .github/workflows/deploy.yml as it stood
# immediately before the cloudflare-pages-migration change deleted it. The
# upstream file no longer exists: this repository deploys through Cloudflare
# Pages Git integration, not GitHub Actions.
#
# Why it is kept: forks still get a GitHub Pages workflow from
# scripts/templates/deploy.yml.template, and
# tests/unit/workflows/fork-template-parity.test.ts must still be able to
# assert that the template has not drifted from a known-good baseline. With
# the upstream file gone, this fixture IS that baseline.
#
# RULE FOR MAINTAINERS: this file does not advance on its own. Whenever you
# upgrade the action pins in deploy.yml.template, update this fixture in the
# SAME change, or the parity test will hold the template to a stale baseline.
#
# It must stay OUT of .github/workflows/, or GitHub Actions would execute it.
# ─────────────────────────────────────────────────────────────────────────────

# Deploy the built VitePress site to GitHub Pages.
#
# Trigger: a `v*` release tag push (so cutting a release also publishes the
# site) plus manual `workflow_dispatch` (to redeploy the current main on demand,
# e.g. the first deploy before the next release).
#
# Pages source is the GitHub Actions deployment method (build_type: workflow) —
# there is NO gh-pages branch; the built artifact is published directly.
#
# The `github-pages` environment restricts which refs may deploy. A tag push
# deploys from `refs/tags/v*`, so that environment MUST allow a `v*` tag rule
# (in addition to the `main` branch, which authorises workflow_dispatch runs).
#
# Actions are SHA-pinned and the toolchain versions match .github/workflows/
# release.yml (Node 24, wasm-pack 0.14.0 + wasm-tools 1.249.0 via taiki-e/install-action) per the
# repo's supply-chain hardening.
name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege + the tokens the official Pages deploy requires.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # taiki-e/install-action installs pinned prebuilt binaries into
          # $CARGO_HOME/bin; a restored binary cache would shadow them.
          cache-bin: "false"

      - name: Install wasm-pack
        uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d # v2.79.2
        with:
          tool: wasm-pack@0.14.0,wasm-tools@1.249.0  # Pinned per spec ci-quality-gates: CI workflows install build toolchain at fixed versions

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (WASM + keygen + VitePress)
        # SITE_BASE bakes the project-site base into the built asset URLs. Set
        # ONLY here; unset everywhere else keeps local/CI builds at root.
        env:
          SITE_BASE: /wxl-platform/
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
